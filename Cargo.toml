[package]
name = "plens"
version = "0.1.0"
edition = "2021"
authors = ["PortLens Team"]
description = "Server-exposure auditor for operators who run their own VPS/nodes"
license = "MIT OR Apache-2.0"

[lib]
name = "plens"
path = "src/lib.rs"

[[bin]]
name = "plens"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"
tokio = { version = "1.40", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"
ratatui = "0.28"
crossterm = { version = "0.28", features = ["event-stream"] }
indicatif = { version = "0.17", features = ["tokio"] }
comfy-table = "7.1"
owo-colors = { version = "4.1", features = ["supports-colors"] }
quick-xml = { version = "0.37", features = ["serialize"] }
rusqlite = { version = "0.32", features = ["bundled", "chrono", "uuid"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"
directories = "5.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
cron = "0.12"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
thiserror = "1.0"
anyhow = "1.0"
miette = { version = "7.4", features = ["fancy"] }
minijinja = { version = "2.2", features = ["loader"] }
socket2 = { version = "0.5", features = ["all"] }
is-terminal = "0.4"
csv = "1.3"
regex = "1.10"
async-stream = "0.3"
mimalloc = { version = "0.1", default-features = false }

[target.'cfg(unix)'.dependencies]
rlimit = "0.10"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.12"
insta = { version = "1.40", features = ["yaml", "json"] }
criterion = { version = "0.5", features = ["async_tokio"] }

[[bench]]
name = "scanner_throughput"
harness = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
